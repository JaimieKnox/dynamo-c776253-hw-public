artifacts = ["/app/output/batch_report.jsonl", "/app/output"]

[task]
name = "dynamo/flash-slot-recover"
description = "Repair NOR flash journal and A/B OTA slot recovery so hard tear, wrap, reclaim, and promote jobs recover correctly."

[metadata]
category = "Hardware Embedded and Low Level Systems"
subcategory = "Embedded and firmware"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["debug", "fix", "recover_or_repair_artifact"]
artifact_type = ["codebase", "hardware_or_firmware_artifact", "generated_output_artifact"]
expert_time_estimate_hours = 12
difficulty_explanation = "Shipped firmware passes gentle sample jobs while defects span composing planes outside the shared newer helper. Journal newer_seq, seal completeness, and modular tip scan already match the docs, so rewriting that helper alone does not clear held-out packs. KV fold still uses a linear seq comparison after wrap. Dual-copy meta epoch selection is correct, but boot ranking still consults image_version before slot_id on equal security and generation. Reclaim skips tombstones, rewrites live keys in linear seq order, and freezes next_seq after rewrite. Journal rescan advances the write cursor only for complete records, so a torn incomplete header leaves a hole that later appends after reboot overwrite. Hard packs combine wrap-crossing puts, reclaim, torn meta, equal-gen image traps, half-ring antipode KV ties, and tear-plus-reboot cursor holes so fixing one plane in isolation still fails another. The environment is a purpose-built synthetic simulator for embedded and OTA firmware engineers."
solution_explanation = "Keep the half-ring wrap comparator with a strict forward window that excludes the antipode for every newer consumer. Keep seal completeness on both seal flags plus payload CRC and modular tip scan. Make KV fold and reclaim fold use that wrap rule rather than linear seq. Make reclaim honor tombstones, rewrite live puts in modular sequence order, and leave next_seq at the post-rewrite tip. On rescan, place the write cursor after the last well-formed header record whether or not it is complete. Rank boot by anti-rollback floor, ACTIVE preference, security_version, wrap-rule generation, then lower slot_id, never image_version. Re-run the batch runner to emit recovered JSON and batch_report.jsonl."
verification_explanation = "A two-phase verifier derives sealed expectations from an independent reference model, removes that model from the tests tree, then grades outputs by strict JSON equality on kv, boot_slot, security_version, generation, and anti_rollback_min. Schema and job order are checked on batch_report.jsonl and per-job recovered.json. Sample smoke must still pass. The verifier also re-runs python3 -m fw against trusted packs so unrepaired firmware cannot pass by writing outputs alone."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
