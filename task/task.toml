artifacts = ["/app/output/batch_report.jsonl", "/app/output"]

[task]
name = "dynamo/flash-slot-recover"
description = "Repair NOR flash journal and A/B OTA slot recovery so hard tear, wrap, reclaim, and promote jobs recover correctly."

[metadata]
category = "Hardware Embedded and Low Level Systems"
subcategory = "Embedded and firmware"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["debug", "fix", "recover_or_repair_artifact"]
artifact_type = ["codebase", "hardware_or_firmware_artifact", "generated_output_artifact"]
expert_time_estimate_hours = 12
difficulty_explanation = "Shipped firmware keeps the half-ring helper, modular tip scan, write-cursor placement, and KV wrap fold aligned with the docs, so rewriting journal.newer_seq or recover_kv alone does not clear held-out packs. Defects sit on composing orchestration and migration planes: reclaim skips tombstones, rewrites live keys in linear sequence order, and reseeds next_seq from a linear numeric max after wrap; dual-copy meta epoch selection uses a linear maximum; device promote stamps and recovered generation report a linear tip; boot ranking still consults image_version before slot_id on equal security and generation. Hard packs combine wrap-crossing reclaim, torn meta near epoch wrap, equal-gen image traps, and promote-after-wrap so fixing one plane in isolation still fails another. The environment is a purpose-built synthetic simulator for embedded and OTA firmware engineers."
solution_explanation = "Keep the half-ring wrap comparator for every newer consumer, including meta epoch selection and boot generation ties. Keep seal completeness, modular tip scan, write-cursor placement after the last well-formed header, and wrap-aware KV fold. Make reclaim honor tombstones, rewrite live puts in modular sequence order, and continue next_seq from the modular pre-erase tip through the post-rewrite tip. Rank boot by anti-rollback floor, ACTIVE preference, security_version, wrap-rule generation, then lower slot_id, never image_version. Stamp promote generation and report recovered generation from the modular complete-record tip. Re-run the batch runner to emit recovered JSON and batch_report.jsonl."
verification_explanation = "A two-phase verifier derives sealed expectations from an independent reference model, removes that model from the tests tree, then grades outputs by strict JSON equality on kv, boot_slot, security_version, generation, and anti_rollback_min. Schema and job order are checked on batch_report.jsonl and per-job recovered.json. Sample smoke must still pass. The verifier also re-runs python3 -m fw against trusted packs so unrepaired firmware cannot pass by writing outputs alone."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
