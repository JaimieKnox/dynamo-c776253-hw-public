artifacts = ["/app/out/suite_ledger.jsonl", "/app/out"]

[task]
name = "dynamo/nor-bank-repair"
description = "Repair NOR ring log and X/Y OTA bank recovery so hard tear, wrap, compact, and promote cases recover correctly."

[metadata]
category = "Hardware Embedded and Low Level Systems"
subcategory = "Embedded and firmware"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["debug", "fix", "recover_or_repair_artifact"]
artifact_type = ["codebase", "hardware_or_firmware_artifact", "generated_output_artifact"]
expert_time_estimate_hours = 12
difficulty_explanation = "Leaf helpers for modular tip reporting, seal completeness, modular meta recovery, and force_meta policy carry look correct, while residuals couple tear-aware write cursor placement, linear meta epoch updates against modular recover, reclaim-path append counter restore after rescan, promote stamps from append-counter predecessors under wrap, and long-horizon packs that need those planes together. Purpose-built synthetic NOR/OTA simulator for embedded firmware engineers."
solution_explanation = "Advance the write cursor past every well-formed programmed header. Derive tip_seq and next_seq from the same modular complete-record tip. Advance meta epochs with the wrap rule on update as well as recover. Leave post-reclaim append allocation on the rescanned wrap tip. Stamp promote from tip_seq. Copy repaired modules into /app/norctl and run the suite runner."
verification_explanation = "A two-phase verifier derives sealed expectations from an independent reference model, removes that model from the tests tree, then grades outputs by strict JSON equality on nvs, boot_bank, sec_rev, tip_seq, and sec_floor. Schema and case order are checked on suite_ledger.jsonl and per-case state.json. Sample smoke must still pass. The verifier also re-runs python3 -m norctl against trusted packs so unrepaired controller code cannot pass by writing outputs alone."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 5400.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
