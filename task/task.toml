artifacts = ["/app/output/batch_report.jsonl", "/app/output"]

[task]
name = "dynamo/flash-slot-recover"
description = "Repair NOR flash journal and A/B OTA slot recovery so hard tear, wrap, reclaim, and promote jobs recover correctly."

[metadata]
category = "Hardware Embedded and Low Level Systems"
subcategory = "Embedded and firmware"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["debug", "fix", "recover_or_repair_artifact"]
artifact_type = ["codebase", "hardware_or_firmware_artifact", "generated_output_artifact"]
expert_time_estimate_hours = 12
difficulty_explanation = "Shipped firmware keeps journal wrap helpers and KV tombstone fold aligned with the docs, so rewriting newer_seq or recover_kv alone does not clear held-out packs. Device promote already passes the modular tip, yet the slot writer silently restamps from a sealed page scan. force_meta_epoch plants the requested epoch while clearing policy bits that REQUIRE_NEWER_SECURITY and IGNORE_ACTIVE_PREF need. Reclaim fold honors tombstones, but rewrite order uses raw numeric sequence compare and the append tip is restored to the pre-erase value after rewrite. Boot ranking still prefers higher image_version on antipode generation ties. Hard packs compose wrap stamps, policy plant, pad reclaim continuity, and image traps so fixing one plane in isolation still fails another. The environment is a purpose-built synthetic simulator for embedded and OTA firmware engineers."
solution_explanation = "Honor the generation argument in promote instead of rescanning sealed journal pages. Preserve policy bits across force_meta_epoch. Rank equal-security boot ties with the half-ring generation rule and lower slot id only, never image_version. Rewrite reclaim live keys in modular older-first order and leave next_seq at the post-rewrite tip. Re-run the batch runner to emit recovered JSON and batch_report.jsonl."
verification_explanation = "A two-phase verifier derives sealed expectations from an independent reference model, removes that model from the tests tree, then grades outputs by strict JSON equality on kv, boot_slot, security_version, generation, and anti_rollback_min. Schema and job order are checked on batch_report.jsonl and per-job recovered.json. Sample smoke must still pass. The verifier also re-runs python3 -m fw against trusted packs so unrepaired firmware cannot pass by writing outputs alone."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
