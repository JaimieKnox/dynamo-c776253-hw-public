artifacts = ["/app/out/suite_ledger.jsonl", "/app/out"]

[task]
name = "dynamo/nor-bank-repair"
description = "Repair NOR ring log and X/Y OTA bank recovery so hard tear, wrap, compact, and promote cases recover correctly."

[metadata]
category = "Hardware Embedded and Low Level Systems"
subcategory = "Embedded and firmware"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["debug", "fix", "recover_or_repair_artifact"]
artifact_type = ["codebase", "hardware_or_firmware_artifact", "generated_output_artifact"]
expert_time_estimate_hours = 12
difficulty_explanation = "Compaction rewrite order and modular tip reporting already match the half-ring wrap rule, so checklist edits on tip_seq or compact leaf order stop early. Residual defects sit in scan resume and orchestration: the write cursor advances only past durable records leaving a hole after payload tears, next_seq follows flash-order last-complete while tip_seq stays modular, runtime compact restores a pre-compact next_seq across rescan, dual-copy meta still picks epochs with raw integer order, and force_meta_epoch clears the policy word. Interaction packs fail unless cursor resume, next_seq ownership, meta wrap, policy carry, and compact continuity agree across reboot and promote. The environment is a purpose-built synthetic simulator for embedded and OTA firmware engineers."
solution_explanation = "Advance the write cursor after any well-formed header, derive next_seq from the same modular complete-record tip as tip_seq, select meta epochs with the half-ring rule while preserving policy on planted epochs, and leave next_seq at the post-rewrite tip through runtime compact. Re-run the suite runner to emit state JSON and suite_ledger.jsonl."
verification_explanation = "A two-phase verifier derives sealed expectations from an independent reference model, removes that model from the tests tree, then grades outputs by strict JSON equality on nvs, boot_bank, sec_rev, tip_seq, and sec_floor. Schema and case order are checked on suite_ledger.jsonl and per-case state.json. Sample smoke must still pass. The verifier also re-runs python3 -m norctl against trusted packs so unrepaired controller code cannot pass by writing outputs alone."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
