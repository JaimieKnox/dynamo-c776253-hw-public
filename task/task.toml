artifacts = ["/app/out/suite_ledger.jsonl", "/app/out"]

[task]
name = "dynamo/nor-bank-repair"
description = "Repair NOR ring log and X/Y OTA bank recovery so hard tear, wrap, compact, and promote cases recover correctly."

[metadata]
category = "Hardware Embedded and Low Level Systems"
subcategory = "Embedded and firmware"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["debug", "fix", "recover_or_repair_artifact"]
artifact_type = ["codebase", "hardware_or_firmware_artifact", "generated_output_artifact"]
expert_time_estimate_hours = 12
difficulty_explanation = "The shipped controller already looks mostly wrap-aware in leaf helpers, so agents that only patch the obvious half-ring comparator tend to stop early. Hard packs require composing promote tip ownership, dual-copy meta recovery across wrap with policy plant, compaction continuity that feeds later boot ranking, and equal-security bank selection when tip stamps disagree under the wrap window. Interaction packs fail unless those planes agree together. The environment is a purpose-built synthetic simulator for embedded and OTA firmware engineers."
solution_explanation = "Align promote stamping, meta epoch selection, compaction continuity, and boot ranking with the ring wrap rule and bank invariants in /app/spec, preserve policy across meta plants, then re-run the suite runner to emit state JSON and suite_ledger.jsonl."
verification_explanation = "A two-phase verifier derives sealed expectations from an independent reference model, removes that model from the tests tree, then grades outputs by strict JSON equality on nvs, boot_bank, sec_rev, tip_seq, and sec_floor. Schema and case order are checked on suite_ledger.jsonl and per-case state.json. Sample smoke must still pass. The verifier also re-runs python3 -m norctl against trusted packs so unrepaired controller code cannot pass by writing outputs alone."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
