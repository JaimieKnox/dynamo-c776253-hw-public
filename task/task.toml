artifacts = ["/app/out/suite_ledger.jsonl", "/app/out"]

[task]
name = "dynamo/nor-bank-repair"
description = "Repair NOR ring log and X/Y OTA bank recovery so hard tear, wrap, compact, and promote cases recover correctly."

[metadata]
category = "Hardware Embedded and Low Level Systems"
subcategory = "Embedded and firmware"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["debug", "fix", "recover_or_repair_artifact"]
artifact_type = ["codebase", "hardware_or_firmware_artifact", "generated_output_artifact"]
expert_time_estimate_hours = 12
difficulty_explanation = "Leaf compaction already rewrites in modular older-first order, so compact.py checklist edits stop early. Residual defects sit in tip reporting and orchestration: tip_seq uses a flash-order complete-record maximum while NVS fold stays modular, promote stamps that tip, runtime compact freezes next_seq across rescan, dual-copy meta still picks epochs with raw integer order and force_meta_epoch clears policy, boot ranking uses raw tip then image_version before bank_id, and record_complete accepts unsealed payload tears. Interaction packs fail unless tip ownership, seal completeness, meta wrap, and boot ranking agree. The environment is a purpose-built synthetic simulator for embedded and OTA firmware engineers."
solution_explanation = "Make tip_seq and promote stamping modular under the ring wrap rule, require both seal phases for completeness, select meta epochs with the half-ring rule while preserving policy, leave next_seq at the post-rewrite tip through runtime compact, and rank equal-security banks by newer tip then lower bank_id. Re-run the suite runner to emit state JSON and suite_ledger.jsonl."
verification_explanation = "A two-phase verifier derives sealed expectations from an independent reference model, removes that model from the tests tree, then grades outputs by strict JSON equality on nvs, boot_bank, sec_rev, tip_seq, and sec_floor. Schema and case order are checked on suite_ledger.jsonl and per-case state.json. Sample smoke must still pass. The verifier also re-runs python3 -m norctl against trusted packs so unrepaired controller code cannot pass by writing outputs alone."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 3600.0

