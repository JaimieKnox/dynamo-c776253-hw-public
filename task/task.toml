[task]
name = "dynamo/nor-bank-repair"
description = "Repair NOR ring log and X/Y OTA bank recovery so hard tear, wrap, compact, and promote cases recover correctly."

[metadata]
category = "Hardware Embedded and Low Level Systems"
subcategory = "Embedded and firmware"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["debug", "fix", "recover_or_repair_artifact"]
artifact_type = ["codebase", "hardware_or_firmware_artifact", "generated_output_artifact"]
expert_time_estimate_hours = 12
difficulty_explanation = "Leaf helpers for modular tip_seq, generation-arg promote, NVS fold, record seals, modular meta epoch ranking, and force_meta_epoch policy preserve ship looking correct. Residuals sit in orchestration that stamps promote from flash-order last complete instead of wrap-coherent tip freshness, boot tip-stamp ranking that uses linear generation compare while meta stays modular, and runtime reclaim that freezes the pre-compact append counter after rescan so later puts can reuse sequences across the rewritten tip. Hard packs compose orch stamp wrap, boot wrap ranking, and horizon reclaim. Purpose-built synthetic NOR/OTA simulator for embedded firmware engineers."
solution_explanation = "Wire promote stamps from wrap-coherent tip freshness at promote time so equal-security banks rank under the ring wrap rule. Rank boot tip stamps with the same half-ring rule used for meta epochs and tip reporting. After compact rewrite keep rescanned tip and append-counter continuity for crash-safe allocation. Copy repaired modules into /app/norctl and run the suite runner."
verification_explanation = "A two-phase verifier derives sealed expectations from an independent reference model, removes that model from the tests tree, then grades outputs by strict JSON equality on nvs, boot_bank, sec_rev, tip_seq, and sec_floor. Schema and case order are checked on suite_ledger.jsonl and per-case state.json. Sample smoke must still pass. The verifier also re-runs python3 -m norctl against trusted packs so unrepaired controller code cannot pass by writing outputs alone."

