artifacts = ["/app/output/batch_report.jsonl", "/app/output"]

[task]
name = "dynamo/flash-slot-recover"
description = "Repair NOR flash journal and A/B OTA slot recovery so hard tear, wrap, reclaim, and promote jobs recover correctly."

[metadata]
category = "Hardware Embedded and Low Level Systems"
subcategory = "Embedded and firmware"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["debug", "fix", "recover_or_repair_artifact"]
artifact_type = ["codebase", "hardware_or_firmware_artifact", "generated_output_artifact"]
expert_time_estimate_hours = 12
difficulty_explanation = "Shipped firmware keeps journal wrap helpers, KV fold, reclaim rewrite order, and recovered generation tip aligned with the docs, so rewriting newer_seq alone does not clear held-out packs. A dual-copy meta policy word gates boot eligibility and ACTIVE preference, but the shipped selector ignores those bits while also using an antipode-inclusive generation compare and a linear meta epoch maximum. Promote stamps the flash-order last complete sequence rather than the modular tip, and reclaim still drops tombstones from the live set. Hard packs combine policy-floor rejection, policy-disabled ACTIVE preference, antipode generation ties, torn meta near epoch wrap, and tombstone reclaim so fixing one plane in isolation still fails another. The environment is a purpose-built synthetic simulator for embedded and OTA firmware engineers."
solution_explanation = "Honor meta policy bits when selecting boot: REQUIRE_NEWER_SECURITY demands security_version strictly above the floor, and IGNORE_ACTIVE_PREF ranks ACTIVE with CANDIDATE by security then wrap-rule generation then slot id. Keep the half-ring comparator that excludes the antipode for meta epochs and boot generation ties. Stamp promote generation from the modular complete-record tip. Make reclaim omit tombstoned keys. Re-run the batch runner to emit recovered JSON and batch_report.jsonl."
verification_explanation = "A two-phase verifier derives sealed expectations from an independent reference model, removes that model from the tests tree, then grades outputs by strict JSON equality on kv, boot_slot, security_version, generation, and anti_rollback_min. Schema and job order are checked on batch_report.jsonl and per-job recovered.json. Sample smoke must still pass. The verifier also re-runs python3 -m fw against trusted packs so unrepaired firmware cannot pass by writing outputs alone."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
