artifacts = ["/app/output/batch_report.jsonl", "/app/output"]

[task]
name = "dynamo/flash-slot-recover"
description = "Repair NOR flash journal and A/B OTA slot recovery so hard tear, wrap, reclaim, and promote jobs recover correctly."

[metadata]
category = "Hardware Embedded and Low Level Systems"
subcategory = "Embedded and firmware"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["debug", "fix", "recover_or_repair_artifact"]
artifact_type = ["codebase", "hardware_or_firmware_artifact", "generated_output_artifact"]
expert_time_estimate_hours = 12
difficulty_explanation = "Shipped firmware keeps journal wrap helpers, write-cursor placement, KV fold, reclaim rewrite order, and next_seq continuation aligned with the docs, so editing journal.newer_seq or sorting reclaim alone does not clear held-out packs. Remaining defects compose across planes: reclaim still drops tombstones from the live set; slot meta and boot generation ties use a half-ring window that wrongly treats the antipode as newer; boot ranking does not prefer ACTIVE over a higher-security CANDIDATE; device promote stamps and recovered generation report a linear sequence tip after wrap. Hard packs combine wrap-crossing generation, torn meta, ACTIVE versus CANDIDATE preference, tombstone reclaim, and promote-after-wrap so a partial fix still fails. The environment is a purpose-built synthetic simulator for embedded and OTA firmware engineers."
solution_explanation = "Keep the half-ring wrap comparator with a strict forward window that excludes the antipode for meta epoch selection and boot generation ties. Keep seal completeness, modular tip scan, write-cursor placement, wrap-aware KV fold, modular reclaim rewrite order, and next_seq continuation from the modular tip. Make reclaim omit tombstoned keys from the rewrite set. Prefer an eligible ACTIVE slot before ranking candidates by security_version, wrap-rule generation, then lower slot_id. Stamp promote generation and report recovered generation from the modular complete-record tip. Re-run the batch runner to emit recovered JSON and batch_report.jsonl."
verification_explanation = "A two-phase verifier derives sealed expectations from an independent reference model, removes that model from the tests tree, then grades outputs by strict JSON equality on kv, boot_slot, security_version, generation, and anti_rollback_min. Schema and job order are checked on batch_report.jsonl and per-job recovered.json. Sample smoke must still pass. The verifier also re-runs python3 -m fw against trusted packs so unrepaired firmware cannot pass by writing outputs alone."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
