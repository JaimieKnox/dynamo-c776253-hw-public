artifacts = ["/app/out/suite_ledger.jsonl", "/app/out"]

[task]
name = "dynamo/nor-bank-repair"
description = "Repair NOR ring log and X/Y OTA bank recovery so hard tear, wrap, compact, and promote cases recover correctly."

[metadata]
category = "Hardware Embedded and Low Level Systems"
subcategory = "Embedded and firmware"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["debug", "fix", "recover_or_repair_artifact"]
artifact_type = ["codebase", "hardware_or_firmware_artifact", "generated_output_artifact"]
expert_time_estimate_hours = 12
difficulty_explanation = "Hard packs require multi-plane recovery agreement under 16-bit wrap, power tear, compaction pressure, dual-copy meta freshness, and equal-security bank ranking after reboot and promote. A repair that aligns only one plane still fails held-out end-to-end recovery. The environment is a purpose-built synthetic simulator for embedded and OTA firmware engineers."
solution_explanation = "Repair ringlog._rescan so tip_seq and next_seq come from the wrap-rule newest complete record (not the last complete record in flash order), and advance the write cursor past incomplete headers so torn records do not pin the append point. In banks.read_meta and write_meta, fix inverted _gen_newer argument order so the freshest dual-copy meta epoch wins and the next epoch advances from that max. In runtime, drop the compact path that stashes next_seq across rewrite, call tip_seq() for promote binding, and preserve policy bits in force_meta_epoch. Copy the repaired modules into place, then run python3 -m norctl to emit /app/out state JSON and suite_ledger.jsonl."
verification_explanation = "A two-phase verifier derives sealed expectations from an independent reference model, removes that model from the tests tree, then grades outputs by strict JSON equality on nvs, boot_bank, sec_rev, tip_seq, and sec_floor. Schema and case order are checked on suite_ledger.jsonl and per-case state.json. Sample smoke must still pass. The verifier also re-runs python3 -m norctl against trusted packs so unrepaired controller code cannot pass by writing outputs alone."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
