artifacts = ["/app/out/suite_ledger.jsonl", "/app/out"]

[task]
name = "dynamo/nor-bank-repair"
description = "Repair NOR ring log and X/Y OTA bank recovery so hard tear, wrap, compact, and promote cases recover correctly."

[metadata]
category = "Hardware Embedded and Low Level Systems"
subcategory = "Embedded and firmware"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["debug", "fix", "recover_or_repair_artifact"]
artifact_type = ["codebase", "hardware_or_firmware_artifact", "generated_output_artifact"]
expert_time_estimate_hours = 12
difficulty_explanation = "Leaf helpers for modular tip_seq, NVS fold, record seals, and boot gen ties ship looking correct. Residuals sit in promote freshness stamps that ignore the modular tip argument and use flash-order last complete, linear meta epoch ranking across dual copies, force_meta_epoch planting that clears policy to zero, and runtime reclaim that freezes the pre-compact append counter after rescan. Hard packs compose stamp wrap, meta wrap with policy recovery, and horizon reclaim. Purpose-built synthetic NOR/OTA simulator for embedded firmware engineers."
solution_explanation = "Stamp promote from the modular tip argument so equal-security banks rank under wrap-coherent freshness. Rank and advance meta epochs with the half-ring rule. Keep force_meta_epoch plants as coherent floor, epoch, and policy records that preserve the policy in force. After compact rewrite keep the rescanned tip for append allocation. Copy repaired modules into /app/norctl and run the suite runner."
verification_explanation = "A two-phase verifier derives sealed expectations from an independent reference model, removes that model from the tests tree, then grades outputs by strict JSON equality on nvs, boot_bank, sec_rev, tip_seq, and sec_floor. Schema and case order are checked on suite_ledger.jsonl and per-case state.json. Sample smoke must still pass. The verifier also re-runs python3 -m norctl against trusted packs so unrepaired controller code cannot pass by writing outputs alone."

[verifier]
timeout_sec = 180.0

