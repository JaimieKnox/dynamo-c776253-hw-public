artifacts = ["/app/out/suite_ledger.jsonl", "/app/out"]

[task]
name = "dynamo/nor-bank-repair"
description = "Repair NOR ring log and X/Y OTA bank recovery so hard tear, wrap, compact, and promote cases recover correctly."

[metadata]
category = "Hardware Embedded and Low Level Systems"
subcategory = "Embedded and firmware"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["debug", "fix", "recover_or_repair_artifact"]
artifact_type = ["codebase", "hardware_or_firmware_artifact", "generated_output_artifact"]
expert_time_estimate_hours = 12
difficulty_explanation = "Leaf helpers for modular tip reporting, dual-copy meta epochs, force_meta_epoch policy preserve, and post-reclaim rescan ship looking correct. Residuals sit where promote consumes a caller tip stamp then re-derives freshness from flash order, where boot tip-stamp ranking calls the half-ring helper with inverted operands, and where reclaim live-key fold uses linear sequence compare under wrap while tip reporting stays modular. Hard packs compose wrap promote stamps, inverted boot ranking, and reclaim fold. Purpose-built synthetic NOR/OTA simulator for embedded firmware engineers."
solution_explanation = "Honor the generation argument as wrap-coherent promote-time tip freshness instead of re-scanning flash order inside promote. Rank equal-security banks with the half-ring helper in the same operand order used for meta epochs. During reclaim, select live keys with wrap-coherent freshness so folded values match tip history after wrap. Copy repaired modules into /app/norctl and run the suite runner."
verification_explanation = "A two-phase verifier derives sealed expectations from an independent reference model, removes that model from the tests tree, then grades outputs by strict JSON equality on nvs, boot_bank, sec_rev, tip_seq, and sec_floor. Schema and case order are checked on suite_ledger.jsonl and per-case state.json. Sample smoke must still pass. The verifier also re-runs python3 -m norctl against trusted packs so unrepaired controller code cannot pass by writing outputs alone."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 5400.0

