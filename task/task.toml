[task]
name = "dynamo/nor-bank-repair"
description = "Repair NOR ring log and X/Y OTA bank recovery so hard tear, wrap, compact, and promote cases recover correctly."

[metadata]
category = "Hardware Embedded and Low Level Systems"
subcategory = "Embedded and firmware"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["debug", "fix", "recover_or_repair_artifact"]
artifact_type = ["codebase", "hardware_or_firmware_artifact", "generated_output_artifact"]
expert_time_estimate_hours = 12
difficulty_explanation = "Promote peer retirement, IGNORE_ACTIVE_PREF pool sense, force_meta dual-copy plants, tip_seq, and modular newer_seq folds ship correct. Residuals sit in write-cursor placement after incomplete well-formed headers on rescan, in compaction rewriting live keys under retained prior sequence numbers instead of consuming the preserved next_seq stream, and in NVS tombstone application that uses linear sequence compare while value updates stay modular. Hard packs compose header tears plus reboot, reclaim under preserved-seq rewrite, and wrap-newer tombstones. Purpose-built synthetic NOR/OTA simulator for embedded firmware engineers."
solution_explanation = "On rescan, advance the append cursor past every already-programmed well-formed header region, complete or not, while tip_seq still comes from complete records only. During compaction, rewrite each live key as a fresh sealed put that consumes the preserved next_seq stream. Apply wrap-newer tombstones with the same half-ring rule used for value updates. Copy repaired modules into /app/norctl and run the suite runner."
verification_explanation = "A two-phase verifier derives sealed expectations from an independent reference model, removes that model from the tests tree, then grades outputs by strict JSON equality on nvs, boot_bank, sec_rev, tip_seq, and sec_floor. Schema and case order are checked on suite_ledger.jsonl and per-case state.json. Sample smoke must still pass. The verifier also re-runs python3 -m norctl against trusted packs so unrepaired controller code cannot pass by writing outputs alone."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 5400.0

