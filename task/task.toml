artifacts = ["/app/output/batch_report.jsonl", "/app/output"]

[task]
name = "dynamo/flash-slot-recover"
description = "Repair NOR flash journal and A/B OTA slot recovery so hard tear, wrap, reclaim, and promote jobs recover correctly."

[metadata]
category = "Hardware Embedded and Low Level Systems"
subcategory = "Embedded and firmware"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["debug", "fix", "recover_or_repair_artifact"]
artifact_type = ["codebase", "hardware_or_firmware_artifact", "generated_output_artifact"]
expert_time_estimate_hours = 10
difficulty_explanation = "Shipped firmware passes narrow sample jobs while four independent defects remain in seal completeness, modular sequence compare, reclaim tombstone fold, and boot slot policy. Hard jobs combine tears, 16-bit wrap, reclaim resurrection, and interrupted promote under anti-rollback so fixing only one path still fails the batch. The environment is a purpose-built synthetic simulator seeded with realistic power-loss, wrap, and reclaim scenarios for embedded and OTA firmware engineers who maintain NOR flash journaling and A/B update recovery."
solution_explanation = "Replace journal completeness and modular newer_seq, make reclaim fold_live honor tombstones like KV recovery, and select boot slots by anti-rollback floor with ACTIVE preference then (-security_version, -generation, slot_id). Re-run the batch runner to emit recovered JSON and batch_report.jsonl."
verification_explanation = "An independent reference model in the verifier replays every job script with correct algorithms and compares kv, boot_slot, security_version, generation, and anti_rollback_min. Schema and job order are checked on batch_report.jsonl and per-job recovered.json. Sample smoke must still pass."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 2400.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
