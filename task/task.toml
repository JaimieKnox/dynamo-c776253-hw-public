artifacts = ["/app/output/batch_report.jsonl", "/app/output"]

[task]
name = "dynamo/flash-slot-recover"
description = "Repair NOR flash journal and A/B OTA slot recovery so hard tear, wrap, reclaim, and promote jobs recover correctly."

[metadata]
category = "Hardware Embedded and Low Level Systems"
subcategory = "Embedded and firmware"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["debug", "fix", "recover_or_repair_artifact"]
artifact_type = ["codebase", "hardware_or_firmware_artifact", "generated_output_artifact"]
expert_time_estimate_hours = 12
difficulty_explanation = "Shipped firmware keeps journal wrap helpers and KV tombstone fold aligned with the docs, so rewriting newer_seq or recover_kv alone does not clear held-out packs. Promote accepts a modular tip argument from the device layer but the slot writer restamps flash-order complete sequences. Boot ranking uses a linear generation compare and prefers higher image_version before slot id even though image_version is metadata only. Reclaim omits tombstones correctly yet resets next_seq to 1 after erase instead of continuing the pre-erase tip. Dual-copy meta still selects by linear epoch and ignores REQUIRE_NEWER_SECURITY / IGNORE_ACTIVE_PREF. Hard packs combine antipode generation ties with image traps, reclaim-then-promote continuity, policy-floor rejection, and torn meta near epoch wrap so fixing one plane in isolation still fails another. The environment is a purpose-built synthetic simulator for embedded and OTA firmware engineers."
solution_explanation = "Honor the generation argument in promote instead of rescanning flash order. Rank equal-security boot ties with the half-ring generation rule and lower slot id only, never image_version. Continue reclaim next_seq from the pre-erase tip through fresh sealed puts. Honor meta policy bits and half-ring meta epoch selection. Re-run the batch runner to emit recovered JSON and batch_report.jsonl."
verification_explanation = "A two-phase verifier derives sealed expectations from an independent reference model, removes that model from the tests tree, then grades outputs by strict JSON equality on kv, boot_slot, security_version, generation, and anti_rollback_min. Schema and job order are checked on batch_report.jsonl and per-job recovered.json. Sample smoke must still pass. The verifier also re-runs python3 -m fw against trusted packs so unrepaired firmware cannot pass by writing outputs alone."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
