artifacts = ["/app/output/batch_report.jsonl", "/app/output"]

[task]
name = "dynamo/flash-slot-recover"
description = "Repair NOR flash journal and A/B OTA slot recovery so hard tear, wrap, reclaim, and promote jobs recover correctly."

[metadata]
category = "Hardware Embedded and Low Level Systems"
subcategory = "Embedded and firmware"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["debug", "fix", "recover_or_repair_artifact"]
artifact_type = ["codebase", "hardware_or_firmware_artifact", "generated_output_artifact"]
expert_time_estimate_hours = 10
difficulty_explanation = "Shipped firmware passes narrow sample jobs while defects span a split tip path where wrap ordering for fold and boot ties is correct but generation stamping still uses linear max, dual-copy anti-rollback meta with a raise_floor tear that can leave only the mirror advanced, and reclaim rewrite continuity that must consume the preserved next_seq stream. Hard jobs combine wrap-crossing reclaim, equal-security candidate ties, and meta floor raise tears so fixing one plane in isolation still fails another. The environment is a purpose-built synthetic simulator seeded with realistic power-loss, wrap, reclaim, and meta-mirror scenarios for embedded and OTA firmware engineers who maintain NOR flash journaling and A/B update recovery."
solution_explanation = "Keep journal completeness on sealed payload CRC and keep the shared wrap comparator for sequence tips and boot generation ties. Make max_generation use that wrap rule rather than a linear numeric max. Make anti-rollback meta dual-copy with mirror-first write, epoch half-ring selection on read, and raise_floor sharing that path. Make reclaim honor tombstones and rewrite live puts from the preserved next_seq stream. Keep boot selection on the anti-rollback floor with ACTIVE preference then security_version, generation under that wrap rule, and lower slot_id. Re-run the batch runner to emit recovered JSON and batch_report.jsonl."
verification_explanation = "An independent reference model in the verifier replays every job script with correct algorithms and compares kv, boot_slot, security_version, generation, and anti_rollback_min. Schema and job order are checked on batch_report.jsonl and per-job recovered.json. Sample smoke must still pass."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
