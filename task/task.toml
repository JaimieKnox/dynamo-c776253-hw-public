artifacts = ["/app/out/suite_ledger.jsonl", "/app/out"]

[task]
name = "dynamo/nor-bank-repair"
description = "Repair NOR ring log and X/Y OTA bank recovery so hard tear, wrap, compact, and promote cases recover correctly."

[metadata]
category = "Hardware Embedded and Low Level Systems"
subcategory = "Embedded and firmware"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["debug", "fix", "recover_or_repair_artifact"]
artifact_type = ["codebase", "hardware_or_firmware_artifact", "generated_output_artifact"]
expert_time_estimate_hours = 12
difficulty_explanation = "Leaf helpers already apply half-ring newer_seq for ring tip, NVS fold, and compact fold, so checklist wrap edits stop early. Residual defects sit across orchestration and ranking: promote stamping uses a flash-order complete-record maximum in the suite runner instead of the modular tip, boot ranking consults image_version before bank_id when stamped tips are non-newer under the half-ring rule, compaction rewrites live keys in key order and freezes next_seq to the pre-erase tip through runtime rescan, and meta write/read still pick epochs with raw integer order while force_meta_epoch clears policy. Hard packs isolate stamp ownership, antipode image fallthrough, meta epoch wrap with policy plant, compact tip continuity, and a long-horizon composition. The environment is a purpose-built synthetic simulator for embedded and OTA firmware engineers."
solution_explanation = "Stamp promote from the modular ring tip in the suite runner. Rank equal-security banks by newer stamped tip then lower bank_id without using image_version. Select meta epochs with the half-ring newer rule on write and dual-copy read, and preserve policy across force_meta_epoch. Rewrite compact live keys in modular older-first order and leave next_seq at the post-rewrite tip through runtime compact and rescan. Re-run the suite runner to emit state JSON and suite_ledger.jsonl."
verification_explanation = "A two-phase verifier derives sealed expectations from an independent reference model, removes that model from the tests tree, then grades outputs by strict JSON equality on nvs, boot_bank, sec_rev, tip_seq, and sec_floor. Schema and case order are checked on suite_ledger.jsonl and per-case state.json. Sample smoke must still pass. The verifier also re-runs python3 -m norctl against trusted packs so unrepaired controller code cannot pass by writing outputs alone."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
