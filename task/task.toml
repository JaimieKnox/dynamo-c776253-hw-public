artifacts = ["/app/out/suite_ledger.jsonl", "/app/out"]

[task]
name = "dynamo/nor-bank-repair"
description = "Repair NOR ring log and X/Y OTA bank recovery so hard tear, wrap, compact, and promote cases recover correctly."

[metadata]
category = "Hardware Embedded and Low Level Systems"
subcategory = "Embedded and firmware"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["debug", "fix", "recover_or_repair_artifact"]
artifact_type = ["codebase", "hardware_or_firmware_artifact", "generated_output_artifact"]
expert_time_estimate_hours = 12
difficulty_explanation = "Hard packs couple tear and wrap across compact, reboot, promote stamps, and dual-copy meta policy. Samples stay green on the shipped tree while held-out packs fail when tip reporting, compaction fold, sequence continuity, and meta policy disagree across the recovery pipeline. Purpose-built synthetic NOR/OTA simulator for embedded firmware engineers."
solution_explanation = "Align tip_seq with the wrap-rule complete tip so reporting, promote stamps, and next_seq share one tip. In compact fold_live, keep wrap-newer live keys instead of flash-order last-wins, and continue sequence allocation across erase/rewrite instead of restarting at 1. In runtime, stamp promotes from tip_seq and preserve recovered policy bits across force_meta_epoch. Copy repaired modules into /app/norctl and run PYTHONPATH=/app python3 -m norctl to emit /app/out."
verification_explanation = "A two-phase verifier derives sealed expectations from an independent reference model, removes that model from the tests tree, then grades outputs by strict JSON equality on nvs, boot_bank, sec_rev, tip_seq, and sec_floor. Schema and case order are checked on suite_ledger.jsonl and per-case state.json. Sample smoke must still pass. The verifier also re-runs python3 -m norctl against trusted packs so unrepaired controller code cannot pass by writing outputs alone."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
