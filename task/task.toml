artifacts = ["/app/out/suite_ledger.jsonl", "/app/out"]

[task]
name = "dynamo/nor-bank-repair"
description = "Repair NOR ring log and X/Y OTA bank recovery so hard tear, wrap, compact, and promote cases recover correctly."

[metadata]
category = "Hardware Embedded and Low Level Systems"
subcategory = "Embedded and firmware"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["debug", "fix", "recover_or_repair_artifact"]
artifact_type = ["codebase", "hardware_or_firmware_artifact", "generated_output_artifact"]
expert_time_estimate_hours = 12
difficulty_explanation = "Hard packs require multi-module agreement: wrap-newer NVS fold across 16-bit wrap, compaction that continues sequence allocation instead of restarting at 1, promote stamps from tip_seq, dual-copy meta policy preservation, and equal-security boot ranking by wrap tip freshness rather than raw u16 magnitude. Samples stay green on the buggy tree while held-out wrap and compact packs fail partial repairs. Purpose-built synthetic NOR/OTA simulator for embedded firmware engineers."
solution_explanation = "Leave the almost-correct ring scan alone. Repair NVS recover_nvs to prefer wrap-newer complete records over flash order. In compact, stash and restore next_seq across erase/rewrite instead of resetting allocation to 1. In runtime, drop the compact next_seq stash so post-rewrite allocation follows a rescan tip, stamp promotes from tip_seq, and preserve policy bits across force_meta_epoch. In banks.select_boot_bank, rank equal-security candidates with the wrap freshness rule instead of raw tip-stamp integer compare. Copy repaired modules into /app/norctl and run PYTHONPATH=/app python3 -m norctl to emit /app/out."
verification_explanation = "A two-phase verifier derives sealed expectations from an independent reference model, removes that model from the tests tree, then grades outputs by strict JSON equality on nvs, boot_bank, sec_rev, tip_seq, and sec_floor. Schema and case order are checked on suite_ledger.jsonl and per-case state.json. Sample smoke must still pass. The verifier also re-runs python3 -m norctl against trusted packs so unrepaired controller code cannot pass by writing outputs alone."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 3600.0

