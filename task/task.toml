artifacts = ["/app/output/batch_report.jsonl", "/app/output"]

[task]
name = "dynamo/flash-slot-recover"
description = "Repair NOR flash journal and A/B OTA slot recovery so hard tear, wrap, reclaim, and promote jobs recover correctly."

[metadata]
category = "Hardware Embedded and Low Level Systems"
subcategory = "Embedded and firmware"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["debug", "fix", "recover_or_repair_artifact"]
artifact_type = ["codebase", "hardware_or_firmware_artifact", "generated_output_artifact"]
expert_time_estimate_hours = 10
difficulty_explanation = "Shipped firmware passes narrow sample jobs while defects span seal completeness, the shared journal wrap comparator used by both KV folding and equal-security boot ties, reclaim tombstone fold, and reclaim rewrite sequence continuity. Hard jobs combine wrap-crossing reclaim with equal-security candidate ties so fixing boot policy in isolation still mis-ranks generations when the shared wrap comparator stays wrong. The environment is a purpose-built synthetic simulator seeded with realistic power-loss, wrap, and reclaim scenarios for embedded and OTA firmware engineers who maintain NOR flash journaling and A/B update recovery."
solution_explanation = "Make journal completeness require a sealed payload CRC and fix the shared wrap comparator used for sequence tips and boot generation ties. Make reclaim honor tombstones and rewrite live puts from the preserved next_seq stream. Keep boot selection on the anti-rollback floor with ACTIVE preference then security_version, generation under that wrap rule, and lower slot_id. Re-run the batch runner to emit recovered JSON and batch_report.jsonl."
verification_explanation = "An independent reference model in the verifier replays every job script with correct algorithms and compares kv, boot_slot, security_version, generation, and anti_rollback_min. Schema and job order are checked on batch_report.jsonl and per-job recovered.json. Sample smoke must still pass."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 2400.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
