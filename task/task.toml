[task]
name = "dynamo/nor-bank-repair"
description = "Repair NOR ring log and X/Y OTA bank recovery so hard tear, wrap, compact, and promote cases recover correctly."

[metadata]
category = "Hardware Embedded and Low Level Systems"
subcategory = "Embedded and firmware"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["debug", "fix", "recover_or_repair_artifact"]
artifact_type = ["codebase", "hardware_or_firmware_artifact", "generated_output_artifact"]
expert_time_estimate_hours = 12
difficulty_explanation = "Leaf helpers for modular tip_seq, generation-arg promote with tip_seq wiring, NVS and compact wrap-newer fold, record seals, modular dual-copy meta recovery, and force_meta_epoch flash policy preserve ship looking correct. Residuals sit in recover reporting tip_seq from flash-order last complete instead of modular tip, recover wiring boot selection through a stale Runtime policy cache that force_meta_epoch zeroes while flash policy stays correct, and write_meta advancing epochs from a primary-only max while _read_meta_full still ranks both copies. Hard packs compose wrap tip reporting, policy-bit boot eligibility after force_meta, and torn dual-copy meta epoch advancement. Purpose-built synthetic NOR/OTA simulator for embedded firmware engineers."
solution_explanation = "Report tip_seq from the modular complete tip at recovery time. Select the boot bank from floor and policy recovered through the dual-copy meta view at recovery time without a stale Runtime policy override. Advance meta epochs from the wrap-newest epoch among all valid copies and leave the primary meta page untouched on after_mirror tears. Copy repaired modules into /app/norctl and run the suite runner."
verification_explanation = "A two-phase verifier derives sealed expectations from an independent reference model, removes that model from the tests tree, then grades outputs by strict JSON equality on nvs, boot_bank, sec_rev, tip_seq, and sec_floor. Schema and case order are checked on suite_ledger.jsonl and per-case state.json. Sample smoke must still pass. The verifier also re-runs python3 -m norctl against trusted packs so unrepaired controller code cannot pass by writing outputs alone."

