artifacts = ["/app/out/suite_ledger.jsonl", "/app/out"]

[task]
name = "dynamo/nor-bank-repair"
description = "Repair NOR ring log and X/Y OTA bank recovery so hard tear, wrap, compact, and promote cases recover correctly."

[metadata]
category = "Hardware Embedded and Low Level Systems"
subcategory = "Embedded and firmware"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["debug", "fix", "recover_or_repair_artifact"]
artifact_type = ["codebase", "hardware_or_firmware_artifact", "generated_output_artifact"]
expert_time_estimate_hours = 12
difficulty_explanation = "Wrap tip reporting, half-ring boot ranking, reclaim fold, and promote stamp consumption ship correct. Residuals sit in promote peer-bank retirement when becoming ACTIVE, in the sense of IGNORE_ACTIVE_PREF during boot pool selection, and in force_meta_epoch planting only the primary meta page while the mirror keeps a wrap-newer stale floor. Hard packs compose dual full promotes, inverted active-preference policy, and primary-only meta plants under wrap epochs. Purpose-built synthetic NOR/OTA simulator for embedded firmware engineers."
solution_explanation = "On a tear-free promote, retire the other bank from ACTIVE before the selected bank becomes ACTIVE so at most one ACTIVE remains. Honor IGNORE_ACTIVE_PREF so the bit expands the ranking pool to every eligible bank, and clear the bit to prefer ACTIVE when any exist. Plant force_meta_epoch on both meta pages as one coherent floor, epoch, and policy record. Copy repaired modules into /app/norctl and run the suite runner."
verification_explanation = "A two-phase verifier derives sealed expectations from an independent reference model, removes that model from the tests tree, then grades outputs by strict JSON equality on nvs, boot_bank, sec_rev, tip_seq, and sec_floor. Schema and case order are checked on suite_ledger.jsonl and per-case state.json. Sample smoke must still pass. The verifier also re-runs python3 -m norctl against trusted packs so unrepaired controller code cannot pass by writing outputs alone."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 5400.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
