artifacts = ["/app/output/batch_report.jsonl", "/app/output"]

[task]
name = "dynamo/flash-slot-recover"
description = "Repair NOR flash journal and A/B OTA slot recovery so hard tear, wrap, reclaim, and promote jobs recover correctly."

[metadata]
category = "Hardware Embedded and Low Level Systems"
subcategory = "Embedded and firmware"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["debug", "fix", "recover_or_repair_artifact"]
artifact_type = ["codebase", "hardware_or_firmware_artifact", "generated_output_artifact"]
expert_time_estimate_hours = 12
difficulty_explanation = "Shipped firmware keeps recover_kv, promote argument honor, force_meta policy preserve, and reclaim tip continuity looking correct, so checklist fixes from earlier wrap or restamp bugs do not clear held-out packs. Boot and meta epoch ranking compare stamped 16-bit values with a raw integer greater-than instead of the journal half-ring rule. Journal rescan still advances next_seq from the flash-order last complete sequence while max_generation stays modular. Reclaim fold_live overwrites by flash scan order even when a wrapped earlier sequence is newer under the wrap rule. Hard packs isolate wrap boot stamps, epoch wrap floor choice, reboot append tips, and reclaim wrap overwrites, then compose them so a single-plane repair still fails. The environment is a purpose-built synthetic simulator for embedded and OTA firmware engineers."
solution_explanation = "Compare boot generations and meta epochs with the journal half-ring newer rule instead of raw integer order. Advance next_seq from the modular complete-record tip on rescan and reboot. Fold reclaim live keys with the same modular newer and tombstone rules as KV recovery. Re-run the batch runner to emit recovered JSON and batch_report.jsonl."
verification_explanation = "A two-phase verifier derives sealed expectations from an independent reference model, removes that model from the tests tree, then grades outputs by strict JSON equality on kv, boot_slot, security_version, generation, and anti_rollback_min. Schema and job order are checked on batch_report.jsonl and per-job recovered.json. Sample smoke must still pass. The verifier also re-runs python3 -m fw against trusted packs so unrepaired firmware cannot pass by writing outputs alone."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
