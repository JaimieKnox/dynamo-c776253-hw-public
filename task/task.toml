artifacts = ["/app/output/batch_report.jsonl", "/app/output"]

[task]
name = "dynamo/flash-slot-recover"
description = "Repair NOR flash journal and A/B OTA slot recovery so hard tear, wrap, reclaim, and promote jobs recover correctly."

[metadata]
category = "Hardware Embedded and Low Level Systems"
subcategory = "Embedded and firmware"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["debug", "fix", "recover_or_repair_artifact"]
artifact_type = ["codebase", "hardware_or_firmware_artifact", "generated_output_artifact"]
expert_time_estimate_hours = 10
difficulty_explanation = "Shipped firmware passes gentle sample jobs while defects span composing planes. The shared newer helper includes the half-ring antipode so equal-distance wrap ties pick the wrong survivor. Dual-copy anti-rollback meta writes both pages but ranks epoch with a linear maximum after wrap. Reclaim skips tombstones and restores the pre-erase next_seq after rewrite instead of leaving the advancing tip. Boot ranking still consults image_version on equal security and generation ties. Hard packs combine wrap-crossing puts, reclaim, torn meta, half-ring antipode ties, and high-image-version candidates so fixing one plane in isolation still fails another. The environment is a purpose-built synthetic simulator for embedded and OTA firmware engineers."
solution_explanation = "Use the half-ring wrap comparator with a strict forward window that excludes the antipode for KV fold, reclaim fold, boot generation ties, meta epoch selection, the journal write-cursor tip that derives next_seq, and output generation. Keep seal completeness on both seal flags plus payload CRC. Make anti-rollback meta dual-copy with mirror-first write and epoch half-ring read, shared by raise_floor. Make reclaim honor tombstones and rewrite live puts by consuming the advancing next_seq stream through the post-rewrite tip. Rank boot by anti-rollback floor, ACTIVE preference, security_version, wrap-rule generation, then lower slot_id, never image_version. Re-run the batch runner to emit recovered JSON and batch_report.jsonl."
verification_explanation = "An independent reference model in the verifier replays every job script with correct algorithms and compares kv, boot_slot, security_version, generation, and anti_rollback_min. Schema and job order are checked on batch_report.jsonl and per-job recovered.json. Sample smoke must still pass. The verifier also re-runs python3 -m fw against trusted packs so unrepaired firmware cannot pass by writing outputs alone."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
